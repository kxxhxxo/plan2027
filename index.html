<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2027 사업계획서</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 부현전기 CMS(자재청구 V5) 시각 규칙 적용 */
:root{
  --bg:#F4F5F7;--surface:#FFFFFF;--surface-2:#F8F9FA;--hover:#F5F6F8;
  --line:#E6E8EC;--line-2:#D4D8DE;--line-3:#EEF0F3;
  --ink:#1A1C21;--ink-2:#454B57;--ink-3:#626977;
  --accent:#E8501A;--accent-ink:#C2410C;--accent-soft:#FFF1EA;--accent-line:#F6C2AA;--btn:#C2410C;--btn-hover:#A8380A;
  --warn-bg:#FFF5E6;--warn-ink:#8F4500;--warn-cell:#FFF0DC;
  --danger:#C0281B;--danger-bg:#FCE9E8;--ok:#1E7A3C;--ok-bg:#E3F3E7;
  --focus:#2563EB;
  --st-conf-bg:#E9EEFF;--st-conf:#2F45A8;--st-done-bg:#E3F3E7;--st-done:#1B6532;--st-draft-bg:#EDF0F4;--st-draft:#465061;
  --panel:var(--surface);--fg:var(--ink);--muted:var(--ink-3);--head:var(--surface-2);--sub:var(--surface-2);--lock:var(--surface-2);
  --wait:var(--warn-cell);--wait-ink:var(--warn-ink);--warn:var(--warn-cell);--bad:var(--danger-bg);--bad-ink:var(--danger);--ok-ink:var(--ok);
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121418;--surface:#1A1D22;--surface-2:#20242A;--hover:#23272E;--line:#2C3138;--line-2:#3B414A;--line-3:#262B32;
  --ink:#ECEEF1;--ink-2:#C4C9D1;--ink-3:#9CA3AE;
  --accent:#FF7A45;--accent-ink:#FF9C72;--accent-soft:#33201A;--accent-line:#6A3421;--btn:#C2410C;--btn-hover:#D24A12;
  --warn-bg:#30250F;--warn-ink:#F3C068;--warn-cell:#3A2C12;--danger:#FF8A80;--danger-bg:#3A1C1C;--ok:#7BD69A;--ok-bg:#16301F;--focus:#86A8FF;
  --st-conf-bg:#232A4D;--st-conf:#AAB8FF;--st-done-bg:#16301F;--st-done:#80D89E;--st-draft-bg:#262B33;--st-draft:#BAC2CE;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121418;--surface:#1A1D22;--surface-2:#20242A;--hover:#23272E;--line:#2C3138;--line-2:#3B414A;--line-3:#262B32;
  --ink:#ECEEF1;--ink-2:#C4C9D1;--ink-3:#9CA3AE;
  --accent:#FF7A45;--accent-ink:#FF9C72;--accent-soft:#33201A;--accent-line:#6A3421;--btn:#C2410C;--btn-hover:#D24A12;
  --warn-bg:#30250F;--warn-ink:#F3C068;--warn-cell:#3A2C12;--danger:#FF8A80;--danger-bg:#3A1C1C;--ok:#7BD69A;--ok-bg:#16301F;--focus:#86A8FF;
  --st-conf-bg:#232A4D;--st-conf:#AAB8FF;--st-done-bg:#16301F;--st-done:#80D89E;--st-draft-bg:#262B33;--st-draft:#BAC2CE;
  color-scheme:dark }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:12px/1.45 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
[hidden]{display:none!important}

/* shell */
.app{display:flex;height:100%;min-height:0}
.side{width:200px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:8px;padding:12px 10px 10px 14px;border-bottom:1px solid var(--line)}
.brand-mark{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.brand b{font-size:13.5px;white-space:nowrap;display:block}
.brand small{display:block;font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.side-scroll{flex:1;overflow:auto;padding:8px 10px 12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-h{display:flex;align-items:center;gap:8px;padding:9px 8px 4px;font-weight:700;color:var(--ink);white-space:nowrap;font-size:12px}
.nav-h+.nav-h{margin-top:4px}
.sub-i{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:6px 10px 6px 18px;border-radius:6px;text-align:left;color:var(--ink-2);position:relative;white-space:nowrap}
.sub-i:hover{background:var(--hover)}
.sub-i.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.sub-i.on::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--accent)}
.side-foot{border-top:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2);font-size:11.5px}
.side-foot .who{font-weight:600}
.side-foot .lo{border:0;background:none;color:var(--ink-3);padding:0;text-align:left}
.side-foot .lo:hover{color:var(--accent-ink);text-decoration:underline}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.topbar{height:42px;flex:none;display:flex;align-items:stretch;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .tabs{display:flex;flex:1;min-width:0;overflow:hidden}
.tab.team{display:flex;align-items:center;border:0;border-right:1px solid var(--line);background:none;padding:0 16px;color:var(--ink-2);white-space:nowrap;position:relative;font-weight:500;border-radius:0}
.tab.team:hover{background:var(--hover)}
.tab.team.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.tab.team.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}
.topbar .unit{display:flex;align-items:center;gap:0;padding:0 10px;border-left:1px solid var(--line)}
.topbar .unit .tab{height:26px;padding:0 10px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;color:var(--ink-2);font-size:11.5px}
.topbar .unit .tab:first-child{border-radius:6px 0 0 6px}
.topbar .unit .tab:last-child{border-radius:0 6px 6px 0;margin-left:-1px}
.topbar .unit .tab.on{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-line);position:relative;z-index:1}
.topbar .status{display:flex;align-items:center;gap:10px;padding:0 14px;border-left:1px solid var(--line);color:var(--ink-3);white-space:nowrap;font-size:11.5px}
.status .lo{border:0;background:none;color:var(--ink-2);padding:0;font-weight:600}
.status .lo:hover{color:var(--accent-ink)}
.page{flex:1;min-height:0;overflow:auto;padding:12px 16px 24px}

/* page header */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:0 0 12px;min-width:0}
.sheethead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:0 14px;min-height:40px;border-bottom:1px solid var(--line)}
.sheethead h2{font-size:13px;margin:0;font-weight:700}
.sheethead .note{color:var(--ink-3);font-size:11.5px}
.sheethead .act{margin-left:auto;display:flex;gap:6px}
.topcard{border:0;background:transparent;margin:0 0 10px;border-radius:0}
.topcard .sheethead{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:16px;row-gap:10px;padding:2px 0 0;border:0;min-height:0}
.topcard .titlebox{grid-row:1;grid-column:1;display:flex;align-items:baseline;gap:10px;min-width:0;white-space:nowrap}
.topcard .titlebox h2{font-size:19px;font-weight:700;letter-spacing:-.02em;flex:none}
.topcard .titlebox .note{color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.topcard .bar.inline{grid-row:1;grid-column:2;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px 5px 14px;gap:6px 12px}
.bar.inline>span{display:inline-flex;align-items:center;gap:4px}
.bar.inline .stbox{padding-left:12px;border-left:1px solid var(--line)}
.bar.inline .btn.chk{border-color:var(--line-2)}
.bar.inline .btn.chk.on{background:var(--st-done-bg);border-color:#7fc79a;color:var(--st-done)}
.stv.s1{background:var(--st-conf-bg);color:var(--st-conf)}
.stv.s2{background:var(--st-done-bg);color:var(--st-done)}
.topcard .kvt{grid-row:2;grid-column:1/-1;justify-self:start}
.bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px}
.bar label{color:var(--ink-3);margin-right:4px}
.bar .rv{flex:1 1 320px;min-width:0;white-space:pre-wrap}
.bar .rv b{color:var(--ink-3);font-weight:500;margin-right:6px}
.stbox{display:inline-flex;align-items:center;gap:6px}
.stv{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-weight:600;font-size:11.5px;background:var(--st-draft-bg);color:var(--st-draft);margin-right:4px}
.stv.s1{background:var(--st-conf-bg);color:var(--st-conf)}
.stv.s2{background:var(--st-done-bg);color:var(--st-done)}
.btn{height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;flex:none;font-size:11.5px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--btn);border-color:var(--btn);color:#fff}
.btn.primary:hover{background:var(--btn-hover)}

/* KPI strip */
.kvt{width:auto;min-width:0;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:11.5px}
.kvt th{position:static;height:26px;padding:0 12px;font-size:11px;color:var(--ink-2);font-weight:600;background:var(--surface-2);border-bottom:1px solid var(--line);border-right:1px solid var(--line-3);text-align:center;white-space:nowrap}
.kvt th.g{text-align:left;font-weight:700;color:var(--ink);background:var(--surface);border-bottom:1px solid var(--line);height:30px;font-size:12px}
.kvt th.g.hi{color:var(--accent-ink);background:var(--accent-soft)}
.kvt td{height:34px;padding:0 12px;min-width:100px;border-right:1px solid var(--line-3);white-space:nowrap;font-size:14px;text-align:right;background:var(--surface)}
.kvt tr>*:last-child{border-right:0}
.kvt th.sep,.kvt td.sep{border-right:1px solid var(--line-2)}
.kvt td.b{font-weight:700}
.kvt td.hi{color:var(--accent-ink)}
.kvt td.bad{color:var(--danger)}
.kvt td.caution{color:var(--warn-ink)}
.kvt td small{display:none}

/* tables */
table{border-collapse:separate;border-spacing:0;min-width:100%;font-size:11.5px}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line-3);padding:0 6px;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tr>*:last-child{border-right:0}
th{position:sticky;top:0;z-index:2;height:28px;background:var(--surface-2);color:var(--ink-2);font-weight:600;font-size:11px;text-align:center}
td{height:27px}
td.ro{padding:0 6px}
td.c{text-align:center}
td.num{text-align:right}
td.muted{color:var(--ink-3)}
td.lock{background:var(--surface-2);color:var(--ink-3)}
td small{color:var(--ink-3);font-size:10.5px;margin-left:4px}
tbody tr:hover td{background:var(--hover)}
td:has(>input),td:has(>select),td:has(>textarea){padding:2px 3px}
td input,td select,td textarea{width:100%;min-width:0;height:22px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);color:inherit;padding:0 6px;box-sizing:border-box}
td textarea{height:auto;min-height:26px;padding:3px 6px;resize:vertical;white-space:pre-wrap;line-height:1.4}
td select{padding:0 2px 0 4px}
td input.num{text-align:right}
td input:focus,td select:focus,td textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
td input[readonly]{border-color:transparent;background:transparent}
td.wait{background:var(--warn-cell);color:var(--warn-ink);font-weight:600}
td.caution{background:var(--warn-cell);color:var(--warn-ink)}
td.dup{background:var(--warn-cell)}
td.bad{background:var(--danger-bg);color:var(--danger);font-weight:600}
tr.sum td{background:var(--surface-2);font-weight:700;border-top:1px solid var(--line-2);height:28px}
tr.sec td{background:var(--accent-soft);color:var(--accent-ink);font-weight:600;height:26px;text-align:left}
td .del{border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:14px;padding:0 6px;line-height:1;opacity:0}
tbody tr:hover .del,td .del:focus-visible{opacity:1}
td .del:hover{color:var(--danger)}
td.st,th.st{position:sticky;left:0;z-index:2;background:var(--surface)}
th.st{z-index:3;background:var(--surface-2)}
tr.sum td.st,tr.sec td.st{background:var(--surface-2)}
td.st2,th.st2{left:120px}
td.st3,th.st3{left:360px;border-right:1px solid var(--line-2)}
table.fit{table-layout:fixed;width:100%}
table.fit td small{display:none}
td.wrap{white-space:normal;line-height:1.5;padding:6px 8px}
td.b{font-weight:700}
.nowrap{overflow:visible}
.wrap{overflow-x:auto}
table.ghd th.g{height:24px;font-weight:700;color:var(--ink);background:var(--surface-2);border-bottom:1px solid var(--line)}
table.ghd thead tr:nth-child(2) th{top:24px}
table.ghd th.rs{height:52px;top:0}
table.ghd td.gsep,table.ghd th.gsep{border-left:1px solid var(--line-2)}
table.ghd th.ed{background:var(--warn-bg);color:var(--warn-ink)}
tr.newrow td{background:var(--accent-soft)}
tr.newrow td.ro{font-weight:600;color:var(--accent-ink)}
table.ghd td.ed,td.ed{background:var(--warn-bg)}
table.ghd td.ed input{border-color:#E9C9A0;background:#fff}
tbody tr:hover td.ed{background:var(--warn-cell)}
table.form{width:100%;table-layout:fixed}
table.form th{position:static;text-align:left;background:var(--surface-2);color:var(--ink-2);font-weight:600;padding:0 10px;height:30px;border-right:1px solid var(--line)}
table.form th.g{color:var(--ink);font-weight:700;height:30px;border-top:1px solid var(--line)}
table.form td{white-space:normal;height:30px}
table.form textarea{min-height:64px}
.split{display:grid;grid-template-columns:minmax(340px,400px) 1fr;gap:12px;align-items:start;margin-bottom:12px}
.split.wide{grid-template-columns:minmax(440px,600px) 1fr}
@media (max-width:1100px){.split,.split.wide{grid-template-columns:1fr}}
.split>.sheet{margin:0}
.lcard,.rcard,.cards{min-width:0}
.lcard table{min-width:100%}
.lcard tr.pick{cursor:pointer}
.lcard tr.pick td{height:28px}
.lcard tr.pick.on td{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.lcard tr.pick.on td:first-child{box-shadow:inset 3px 0 var(--accent)}
.lcard td.bname{padding-left:12px}
.lcard td small{display:none}
.sub{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.sub .tab{height:26px;padding:0 11px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);font-weight:600;color:var(--ink-2);font-size:11.5px;display:inline-flex;align-items:center;gap:4px}
.sub .tab:hover{background:var(--hover)}
.sub .tab.on{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-line)}
.sub .cnt{color:var(--ink-3);font-size:10.5px;font-weight:500}
.sub .tab.on .cnt{color:var(--accent-ink)}
.foot{padding:8px 12px;display:flex;gap:12px;flex-wrap:wrap;color:var(--ink-3);font-size:11.5px;border-top:1px solid var(--line)}
.foot:empty{display:none}
.empty{padding:28px 14px;color:var(--ink-3)}
.two{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.summary{padding:12px 14px}
.summary table{min-width:0}
.prev{padding:10px 14px;border-bottom:1px solid var(--line)}
.prev table{min-width:0}
.bar select{border:1px solid var(--line-2);border-radius:6px;height:26px;padding:0 6px;background:var(--surface)}
textarea.rvin{width:100%;border:1px solid var(--line-2);border-radius:6px;padding:6px 8px;background:var(--surface);color:inherit;box-sizing:border-box}

/* 이슈 우측 카드 */
.fhead{padding:10px 12px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.fsite{display:flex;align-items:baseline;gap:10px}
.fsite b{font-size:14px}
.fsite span{color:var(--ink-3)}
.fhead .kvt{align-self:stretch;width:100%}
.fhead .kvt td{min-width:0}
.fhead .kvt td{height:30px;font-size:12.5px}
.fsec{padding:8px 12px 6px;font-weight:700;font-size:12px;background:var(--surface-2);border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.fhead+.fsec{border-top:0}
.fgrid{display:grid}
.fgrid.c4{grid-template-columns:repeat(4,1fr)}
.fgrid.c2{grid-template-columns:1fr 1fr}
.f{display:flex;flex-direction:column;gap:4px;padding:8px 12px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.fgrid>.f:last-child{border-right:0}
.f label{font-size:11px;color:var(--ink-3);font-weight:600}
.f .ctl input,.f .ctl select,.f .ctl textarea{width:100%;height:28px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);padding:0 8px;color:inherit}
.f .ctl textarea{height:auto;min-height:84px;padding:6px 8px;resize:vertical;line-height:1.5;white-space:pre-wrap}
.f .ctl input.num{text-align:right}
.f .ctl input:focus,.f .ctl select:focus,.f .ctl textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.f .ctl.ro{min-height:28px;display:flex;align-items:center;white-space:pre-wrap}
@media (max-width:1300px){.fgrid.c4{grid-template-columns:1fr 1fr}}

/* 작성 순서 플로우 */
.flowwrap{position:relative;padding:18px 16px 22px}
.farrows{position:absolute;inset:0;pointer-events:none}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:0 56px;position:relative}
.fcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.fct{font-weight:700;font-size:12.5px;color:var(--ink);padding:0 0 4px;border-bottom:2px solid var(--line-2)}
.fn{position:relative;z-index:1;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:9px 12px;display:flex;flex-direction:column;gap:3px;min-height:56px;justify-content:center}
.fn b{font-size:12.5px}
.fn span{font-size:11px;color:var(--ink-3);line-height:1.4}
.fn.go{cursor:pointer}
.fn.go:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fn.key{border-color:var(--accent-line);background:var(--accent-soft)}
.fn.key b{color:var(--accent-ink)}
.fn.end{background:var(--surface-2)}
@media (max-width:1100px){.flow{grid-template-columns:1fr 1fr}.farrows{display:none}}

.btn.chk.on{background:var(--st-done-bg);border-color:#9fd3b0;color:var(--st-done)}
.fn.ok{border-color:#9fd3b0}
.fn .okm{font-style:normal;color:var(--ok);margin-left:6px;font-weight:700}
/* login */
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:20}
.loginbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:26px 28px;width:min(360px,92vw);display:flex;flex-direction:column;gap:6px}
.loginbox h2{font-size:17px;margin:0 0 12px;letter-spacing:-.01em}
.loginbox label{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.loginbox input{height:36px;border:1px solid var(--line-2);border-radius:7px;padding:0 10px;background:var(--surface)}
.loginbox input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.loginbox .btn.primary{height:36px;justify-content:center;margin-top:12px}
.loginbox .err{color:var(--danger);font-size:11.5px;min-height:16px}
@media (prefers-reduced-motion:no-preference){.tab,.btn,.sub-i{transition:background .12s,color .12s}}
@media (max-width:900px){.side{display:none}.page{padding:10px 12px 20px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">

const SHEETS={
 안내:{t:'작성 순서',special:'guide'},

 거래처:{t:'거래처 리스트',special:'clients',cols:[

   {k:'Email',l:'E-Mail',w:200},{k:'시평액',l:'시평액 (억원)',w:100,num:1,raw:1},{k:'순위',l:'순위',w:60},{k:'등록상태',l:'등록상태',w:80},{k:'등록만기',l:'등록만기',w:90},{k:'비고',l:'비고',w:140}],
   blank:()=>({건설사:'',신용:'',담당부서:'',담당자명:'',회사번호:'',HP:'',Email:'',시평액:'',순위:'',등록상태:'',등록만기:'',비고:''})},
 신규거래처:{t:'신규 거래처',list:true,cols:[

   {k:'특장점',l:'특장점',w:200},{k:'지원필요',l:'영업 지원 필요사항',w:200},{k:'비고',l:'비고',w:120}],
   blank:()=>({건설사:'',시평액:'',순위:'',등록현황:'',협력3사:'',특장점:'',지원필요:'',비고:''})},
 이슈:{t:'이슈 · 설계변경/정산',special:'issues'},
 소장영입:{t:'현장소장 발굴 및 영입 계획',list:true,cols:[
   {k:'이름',l:'이름',w:90},{k:'현재회사',l:'현재 근무회사',w:160},{k:'출생년도',l:'출생년도',w:90,sel:'year'},{k:'나이',l:'나이',w:60,calcText:r=>{const y=num(r.출생년도);return y>1900?String(new Date().getFullYear()-y+1)+'세':''}},{k:'경력',l:'경력 (년)',w:80,raw:1},{k:'자격증',l:'자격증',w:200},{k:'희망지역',l:'희망 근무지역',w:120},{k:'영입시기',l:'영입 예정 시기',w:110,sel:'month'},
   {k:'배치현장',l:'배치 예정 현장',w:240,calcText:(r,d)=>{const a=pickedBy(d,'예비소장',recruitLabel(r));return a?a.현장명+(a.예정?' ('+a.예정+' 착공)':''):''}}],
   blank:()=>({이름:'',현재회사:'',출생년도:'',경력:'',자격증:'',희망지역:'',영입시기:''})},
};
let docs={}, team='t1', sheet='수주목표', readonly=false, subtab={}, cred=null, lastSaved={};
try{team=localStorage.getItem('bp.team')||team; sheet=localStorage.getItem('bp.sheet')||sheet; subtab=JSON.parse(localStorage.getItem('bp.sub')||'{}')}catch(e){}
if(!SHEETS[sheet])sheet='안내';
const setSub=(k,v)=>{subtab[k]=v;try{localStorage.setItem('bp.sub',JSON.stringify(subtab))}catch(e){};render()};
const curYear=()=>{const y=Number(subtab.year);return YEARS.includes(y)?y:2027};
const $=s=>document.querySelector(s);
const el=(t,a,...c)=>{const e=document.createElement(t);if(a)for(const k in a){if(k==='class')e.className=a[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k])}for(const x of c){if(x==null)continue;e.append(x.nodeType?x:document.createTextNode(String(x)))}return e};
let UNIT='원'; try{UNIT=localStorage.getItem('bp.unit')==='억'?'억':'원'}catch(e){}
const fmt=v=>{if(v===''||v==null)return '';const n=Number(String(v).replace(/,/g,''));return isNaN(n)?String(v):n.toLocaleString('ko-KR')};
const fmtM=v=>{if(v===''||v==null)return '';const n=num(v);if(UNIT==='억')return (n/1e8).toLocaleString('ko-KR',{minimumFractionDigits:1,maximumFractionDigits:1});return fmt(n)};
const parseM=t=>{const c=String(t).replace(/[^\d.-]/g,'');if(c===''||c==='-')return '';const n=Number(c);if(isNaN(n))return '';return UNIT==='억'?String(Math.round(n*1e8)):String(Math.round(n))};

function setStatus(t){const st=$('#status');const lo=st.querySelector('.lo');st.textContent=t;if(lo)st.append(lo)}

// ---- persistence: Apps Script, 섹션 단위 저장(바뀐 섹션만), 팀별 한 번에 하나
const pending={}, inflight={}, timers={};
const sectionOf=(d,sec)=>sec==='meta'?Object.fromEntries(META_KEYS.map(k=>[k,d[k]])):sec==='kpi'?(d.실적2026||{}):d[sec];
const writable=sec=>ROLE==='admin'||sec!=='kpi';
const snapshot=(d,id)=>Object.fromEntries(secsOf(id).filter(writable).map(sec=>[sec,JSON.stringify(sectionOf(d,sec)??null)]));
function save(id){ if(readonly||!docs[id])return; if(id==='hq'&&ROLE!=='admin')return; docs[id].updatedAt=new Date().toISOString(); pending[id]=true; setStatus('저장 중'); clearTimeout(timers[id]); timers[id]=setTimeout(()=>flush(id),800); }
let chain=Promise.resolve();
function post(body){ const run=async()=>{ let last; for(let i=0;i<3;i++){ try{ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({id:cred.id,pw:cred.pw},body))}); let j; try{ j=await r.json() }catch(e){ throw new Error('server') } if(!j.ok)throw new Error(j.error||'save'); return j }catch(e){ last=e; if(e.message==='auth'||e.message==='forbidden')throw e; await new Promise(r=>setTimeout(r,1500*(i+1))) } } throw last };
  const p=chain.then(run,run); chain=p.catch(()=>{}); return p }
async function flush(id){
  if(inflight[id]){pending[id]=true;return}
  pending[id]=false; inflight[id]=true;
  try{
    const d=docs[id]; const now=snapshot(d,id); const prev=lastSaved[id]||{};
    for(const sec of secsOf(id)){ if(!writable(sec)||now[sec]===prev[sec])continue; await post({action:'save',team:id,section:sec,value:JSON.parse(now[sec])}); prev[sec]=now[sec]; }
    lastSaved[id]=prev; setStatus('저장됨 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){ setStatus(e.message==='auth'?'로그인이 만료됨 — 다시 로그인':'저장 실패: '+(e.message||'')); }
  inflight[id]=false; if(pending[id])flush(id);
}
async function load(){
  const r=await fetch(API+'?id='+encodeURIComponent(cred.id)+'&pw='+encodeURIComponent(cred.pw)+'&_='+Date.now());
  const j=await r.json(); if(!j.ok)throw new Error(j.error||'load');
  return j;
}
function assemble(sections){ const d={}; for(const sec in sections){const v=sections[sec].value; if(sec==='meta'){const m=Object.assign({},v||{});const k=m.실적2026;delete m.실적2026;Object.assign(d,m);if(k&&!d.실적2026)d.실적2026=k} else if(sec==='kpi'){if(v&&Object.keys(v).length)d.실적2026=v} else d[sec]=v} return d }
async function boot(j){
  const role=j.role; const myTeam=j.team; ROLE=role;
  TEAMS=role==='admin'?ALL_TEAMS:ALL_TEAMS.filter(x=>x[0]===myTeam);
  docs={}; lastSaved={};
  const need=[];
  for(const [id] of TEAMS){ if(id==='all')continue; const secs=j.data[id]; if(secs&&Object.keys(secs).some(k=>k!=='ping')){docs[id]=assemble(secs);docs[id].team=docs[id].team||id} else {docs[id]=SEEDS[id]?JSON.parse(JSON.stringify(SEEDS[id])):blankDoc(id);need.push(id)} }
  for(const id of Object.keys(docs)){sites(docs[id]);orders(docs[id]);lastSaved[id]=need.includes(id)?{}:snapshot(docs[id],id)}
  docs.hq=assemble(j.data.hq||{}); docs.hq.소장명단=docs.hq.소장명단||[]; lastSaved.hq=snapshot(docs.hq,'hq'); syncRoster();
  if(!TEAMS.some(x=>x[0]===team))team=TEAMS[0][0];
  render();
  if(need.length){ setStatus('초기 자료 올리는 중 ('+need.map(teamName).join(', ')+')'); for(const id of need){pending[id]=true;await flush(id)} }
  if(role==='admin')setInterval(async()=>{ if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#main'))return; if(Object.values(inflight).some(Boolean)||Object.values(pending).some(Boolean))return; try{const jj=await load(); let changed=false; for(const id in jj.data){ if(!jj.data[id]||!Object.keys(jj.data[id]).some(k=>k!=='ping'))continue; const nd=assemble(jj.data[id]); nd.team=nd.team||id; if(id==='hq'){nd.소장명단=nd.소장명단||[]} if(JSON.stringify(nd)!==JSON.stringify(docs[id])){docs[id]=nd;lastSaved[id]=snapshot(nd,id);changed=true} } if(changed)render() }catch(e){} },120000);
}
// ---- model helpers (현장 마스터 = sites, 수주목표 = 수주목표)
const koKey=v=>String(v||'').replace(/㈜|\(주\)/g,'').trim();
const ko=(a,b)=>koKey(a).localeCompare(koKey(b),'ko');
const koSort=(arr,...fs)=>{arr.sort((x,y)=>{for(const f of fs){const c=ko(f(x),f(y));if(c)return c}return 0});return arr};
const capOf=(d,name)=>{let m=-1;for(const r of (d.거래처||[]))if(koKey(r.건설사)===koKey(name)){const v=num(r.시평액);if(v>m)m=v}return m};
const bcmp=d=>(a,b)=>{const x=capOf(d,a),y=capOf(d,b);if(x!==y)return y-x;return ko(a,b)};
const bsort=(d,arr,bf,sf)=>{const c=bcmp(d);arr.sort((x,y)=>c(bf(x),bf(y))||ko(sf(x),sf(y)));return arr};
const sites=d=>bsort(d,d.sites||(d.sites=[]),r=>r.건설사,r=>r.현장명);
const orders=d=>bsort(d,d.수주목표||(d.수주목표=[]),r=>r.건설사,r=>r.현장명);
const siteById=(d,id)=>sites(d).find(s=>s.id===id);
const monthsOf=(r,y)=>{const k='m'+y;if(!Array.isArray(r[k])||r[k].length!==12)r[k]=['','','','','','','','','','','',''];return r[k]};
const salesTotal=(r,y)=>monthsOf(r,y).reduce((a,v)=>a+num(v),0);
const Y=(r,y)=>r['y'+y]||(r['y'+y]={자재:'',노무:'',간접:''});
const cost=(r,y)=>{const o=Y(r,y);return num(o.자재)+num(o.노무)+num(o.간접)};
const orderYear=r=>Math.floor(ym(r.예정)/100);
const isFull=r=>!!(r.현장명&&num(r.목표수주액)&&normProb(r.가능성)&&r.예정);
const pmOf=(d,r)=>{const s=r.sid&&siteById(d,r.sid);return s?s.소장:(r.소장||'')};
const siteOf=(d,r)=>{const s=r.sid&&siteById(d,r.sid);return s?s.현장명:(r.현장명||'')};
const builderOf=(d,r)=>{const s=r.sid&&siteById(d,r.sid);return s?s.건설사:(r.건설사||'')};
const WIN=[ym('2026.11'),ym('2027.12')];
const ownWait=d=>sites(d).filter(r=>r.소장&&toYM(r.준공예정)&&ym(toYM(r.준공예정))>=WIN[0]&&ym(toYM(r.준공예정))<=WIN[1]).map(r=>({m:toYM(r.준공예정),label:label(r.소장.trim(),toYM(r.준공예정)),ym:ym(toYM(r.준공예정)),site:r}));
const pickedBy=(d,field,lab)=>orders(d).find(x=>x[field]===lab);
const roster=()=>(docs.hq&&docs.hq.소장명단)||[];
const toYM=iso=>/^\d{4}-\d{2}/.test(iso||'')?iso.slice(0,7).replace('-','.'):(iso||'');
const rosterSite=r=>{ // 현재 배치 현장: 불러온 팀 자료의 소장 기준, 없으면 명단에 적힌 현장(admin이 열 때 동기화됨)
  for(const id in docs){if(id==='hq')continue;const s0=sites(docs[id]).find(x=>(x.소장||'').trim()===r.이름);if(s0)return {team:id,site:s0.현장명,준공:s0.준공예정||''}}
  return r.현장?{team:r.팀||'',site:r.현장,준공:r.준공||''}:null};
const rosterActive=()=>roster().filter(r=>r.이름&&r.상태!=='제외');
const rosterWait=()=>rosterActive().filter(r=>!rosterSite(r));
const rosterLabel=r=>{const at=rosterSite(r);const m=at?toYM(at.준공):'';return r.이름+' ('+(m||'대기')+')'};
const waitLabel=rosterLabel;
// 예비소장 후보: 전사 현장소장 전원(팀 무관, 준공월 기준) + 영입 예정. 자기 팀에서 겸임으로 표시한 소장은 제외

  cred={id:id.trim().toLowerCase(),pw};
