<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2027 사업계획서</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 상단 고정 바(팀 탭 → 그룹별 시트 탭) + 가로 스크롤 표. 업무용 시트 톤 */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --fg:#1c2430; --muted:#6b7686; --line:#d9dee6; --head:#eef1f5; --lock:#f3f4f6;
  --accent:#1f5fbf; --accent-soft:#e6eefb; --wait:#fff3d6; --warn:#fde0d4; --bad:#f8c9c0; --ok:#e3f2e6;
  --font:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141922; --panel:#1b222d; --fg:#e6eaf0; --muted:#97a2b3; --line:#303a48; --head:#222b38; --lock:#1f2733;
  --accent:#6ea2ee; --accent-soft:#23324a; --wait:#4a3c1c; --warn:#5a2e24; --bad:#6b2a22; --ok:#24402b; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141922; --panel:#1b222d; --fg:#e6eaf0; --muted:#97a2b3; --line:#303a48; --head:#222b38; --lock:#1f2733;
  --accent:#6ea2ee; --accent-soft:#23324a; --wait:#4a3c1c; --warn:#5a2e24; --bad:#6b2a22; --ok:#24402b; color-scheme:dark }
html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
h1{font-size:17px;font-weight:700;margin:0 12px 0 0;letter-spacing:-.01em}
.status{font-size:12px;color:var(--muted)}
.unit{margin-left:auto;display:flex;gap:2px}
.unit .tab{padding:3px 9px;font-size:12px}
td.st,th.st{position:sticky;left:0;z-index:2;background:var(--panel)}
th.st{z-index:3;background:var(--head)}
tr.sum td.st,tr.sec td.st{background:var(--head)}
tr.sec td.st{background:var(--accent-soft)}
td.st2,th.st2{left:120px}
td.st3,th.st3{left:360px;border-right:2px solid var(--line)}
td.st input{background:var(--panel)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.grp{display:flex;align-items:center;gap:4px;padding:3px 6px 3px 0;border-right:1px solid var(--line);margin-right:6px}
.grp:last-child{border-right:0}
.grp .gl{font-size:11px;color:var(--muted);letter-spacing:.04em;margin-right:2px}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.tab:hover{border-color:var(--accent)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.tab.team{font-weight:500}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-top:4px;font-size:12.5px}
.bar label{color:var(--muted);margin-right:4px}
.bar select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--panel);color:var(--fg)}
.bar .rv{flex:1 1 320px;min-width:0;color:var(--fg);white-space:pre-wrap}
.bar .rv b{color:var(--muted);font-weight:500;margin-right:6px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-block:8px 24px;min-width:0}
.sheethead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line)}
.sheethead h2{font-size:14px;margin:0;font-weight:700}
.sheethead .note{color:var(--muted);font-size:12px}
.sheethead .act{margin-left:auto;display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.sub{display:flex;flex-wrap:wrap;gap:4px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--head)}
.sub .tab{padding:3px 10px;font-size:12px;border-radius:14px}
.sub .cnt{color:var(--muted);font-size:11px;margin-left:3px}
.wrap{overflow-x:auto;padding:0 0 6px}
.prev{padding:10px 14px;border-bottom:1px solid var(--line)}
.prev table{min-width:0}
table{border-collapse:separate;border-spacing:0;min-width:100%;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;vertical-align:middle;white-space:nowrap}
th{background:var(--head);font-weight:500;font-size:12px;padding:7px 8px;text-align:center;position:sticky;top:0}
td.ro{padding:5px 8px}
td.c{text-align:center}
td.num{text-align:right}
td.muted{color:var(--muted)}
td.lock{background:var(--lock)}
td small{color:var(--muted);font-size:11px;margin-left:4px}
td input,td select,td textarea{width:100%;min-width:0;border:0;background:transparent;color:inherit;font:inherit;padding:5px 8px;box-sizing:border-box}
td textarea{resize:vertical;min-height:30px;white-space:pre-wrap}
td input.num{text-align:right}
td input:focus,td select:focus,td textarea:focus{background:var(--accent-soft);outline:none}
td.wait{background:var(--wait)}
td.dup{background:var(--warn)}
td.bad{background:var(--bad)}
td.caution{background:var(--wait)}
tr.sum td{background:var(--head);font-weight:700}
tr.sec td{background:var(--accent-soft);font-weight:700;padding:5px 8px}
td .del{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;padding:3px 8px;line-height:1}
td .del:hover{color:#c0392b}
.foot{padding:8px 14px;display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.empty{padding:28px 14px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.summary{padding:10px 14px}
.summary table{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;padding:12px 14px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.kpi .l{font-size:11.5px;color:var(--muted)}
.kpi .v{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:11.5px;color:var(--muted)}
.kpi.bad .v{color:#b3261e}
@media (prefers-reduced-motion:no-preference){.tab,.btn{transition:border-color .12s,color .12s}}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.loginbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:26px 28px;width:min(340px,100%);display:flex;flex-direction:column;gap:6px}
.loginbox h2{font-size:16px;margin:0 0 10px}
.loginbox label{font-size:12px;color:var(--muted);margin-top:6px}
.loginbox input{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--panel);color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;padding:8px;margin-top:12px;font-size:13px}
.loginbox .err{color:#b3261e;font-size:12px;min-height:16px}
.status .lo{margin-left:10px;border:0;background:transparent;color:var(--accent);cursor:pointer;font:inherit;font-size:12px}
</style>
</head>
<body>
<div class="top">
  <div class="row">
    <h1>2027년 사업계획서</h1>
    <div class="tabs" id="teamTabs"></div>
    <div class="unit" id="unit"><button class="tab" data-u="원">원</button><button class="tab" data-u="억">억</button></div>
    <div class="status" id="status">불러오는 중</div>
  </div>
  <div class="tabs" id="sheetTabs"></div>
</div>
<div id="main"></div>
<div id="login" hidden><form class="loginbox" id="loginForm"><h2>2027년 사업계획서</h2><label for="lid">아이디</label><input id="lid" autocomplete="username" autocapitalize="off"><label for="lpw">비밀번호</label><input id="lpw" type="password" autocomplete="current-password"><button class="btn primary" type="submit">들어가기</button><div class="err" id="lerr"></div></form></div>
<datalist id="dlClients"></datalist>


<script>
(function(){
'use strict';
const API='https://script.google.com/macros/s/AKfycbyNyN0wcDLsnnkl9d1DnGzDdadOWu9OInh1rJy4w-CldrTEX46BDmLe5HE0YyUkTwII/exec';
const ALL_TEAMS=[['t1','1팀'],['t2','2팀'],['t3','t3'],['t4','4팀'],['t5','5팀'],['t6','6팀'],['gov','관급'],['all','취합']];
ALL_TEAMS[2][1]='3팀';
let TEAMS=ALL_TEAMS;
const SECTIONS=['meta','kpi','sites','수주목표','매출목표','소장배치','거래처','신규거래처','소장영입'];
const META_KEYS=['team','pm','status','updatedAt','review'];
let ROLE='team';
const YEARS=[2026,2027,2028]; const ACTUAL={2026:10};
const MONTHS=(()=>{const a=[];for(let y=2026;y<=2028;y++)for(let m=1;m<=12;m++){if(y===2026&&m<11)continue;a.push(y+'.'+String(m).padStart(2,'0'))}return a})();
const PROB={'확정':1,'유력':0.7,'추진':0.3};
const STATUS=['작성 중','제출','확정'];
const DC_STATUS=['당초','1차 진행중','1차 완료','2차 진행중','2차 완료','3차 진행중','3차 완료','4차 진행중','4차 완료','정산 중','정산완료','추가공사'];
const DC_STEP=['1. 도면작업','2. 실물량 산출','3. 내역서 작업','4. 당초 감독관 검토','5. 수정 내역서 작업','6. 수정 내역서 감독관 검토','7. PM - 감독관 금액협의','8. 상신(본사 검토)','9. 본사결재 완료','10. 변경계약 대기','11. 계약완료'];
const monthsLeft=iso=>{if(!iso)return '';const d=new Date(iso);if(isNaN(d))return '';const n=new Date();return (d.getFullYear()-n.getFullYear())*12+(d.getMonth()-n.getMonth())};
const GROUPS=[['영업',['수주목표','거래처','신규거래처']],['매출·손익',['매출목표','손익']],['인력',['현장구성','소장배치','소장영입']],['현장',['이슈']]];
const ORDER_COLS=[
   {k:'건설사',l:'건설사',w:130,dl:1},{k:'현장명',l:'현장명',w:260},{k:'예상도급액',l:'예상 도급액 (원)',w:150,num:1},{k:'목표수주액',l:'목표 수주액 (원)',w:150,num:1},
   {k:'가능성',l:'가능성',w:80,sel:'prob'},{k:'기대수주액',l:'기대 수주액 (원)',w:150,num:1,calc:r=>r.가능성?Math.round(num(r.목표수주액)*(PROB[r.가능성]||0)):''},
   {k:'입찰예정',l:'입찰 예정',w:95,sel:'month'},{k:'예정',l:'착공 예정',w:95,sel:'month'},
   {k:'예비소장',l:'예비소장',w:150,sel:'pm'},{k:'예비공무',l:'예비공무',w:150,sel:'gm'},{k:'영업현황',l:'영업현황',w:220}];
const SHEETS={
 수주목표:{t:'수주목표',special:'orders'},
 매출목표:{t:'매출목표',special:'sales'},
 손익:{t:'기성·투입 손익',special:'profit'},
 현장구성:{t:'현장 구성 현황',special:'sites'},
 소장배치:{t:'준공일정·소장/공무 배치',special:'assign'},
 거래처:{t:'거래처 리스트',list:true,cols:[
   {k:'건설사',l:'건설사',w:160},{k:'신용',l:'신용',w:80,sel:'credit'},{k:'담당부서',l:'담당부서',w:140},{k:'담당자명',l:'담당자명',w:100},{k:'회사번호',l:'회사번호',w:120},{k:'HP',l:'H.P',w:120},
   {k:'Email',l:'E-Mail',w:200},{k:'시평액',l:'시평액 (억원)',w:100,num:1,raw:1},{k:'순위',l:'순위',w:60},{k:'등록상태',l:'등록상태',w:80},{k:'등록만기',l:'등록만기',w:90},{k:'비고',l:'비고',w:140}],
   blank:()=>({건설사:'',신용:'',담당부서:'',담당자명:'',회사번호:'',HP:'',Email:'',시평액:'',순위:'',등록상태:'',등록만기:'',비고:''})},
 신규거래처:{t:'신규 거래처',list:true,cols:[
   {k:'건설사',l:'건설사',w:140},{k:'시평액',l:'시평액 (억원)',w:100,num:1,raw:1},{k:'순위',l:'순위',w:60},{k:'등록현황',l:'당사 등록 현황',w:110},{k:'협력3사',l:'주요 협력 3사',w:240},
   {k:'특장점',l:'특장점',w:200},{k:'지원필요',l:'영업 지원 필요사항',w:200},{k:'비고',l:'비고',w:120}],
   blank:()=>({건설사:'',시평액:'',순위:'',등록현황:'',협력3사:'',특장점:'',지원필요:'',비고:''})},
 이슈:{t:'이슈 · 설계변경/정산',special:'issues'},
 소장영입:{t:'현장소장 발굴 및 영입 계획',list:true,cols:[
   {k:'이름',l:'이름',w:90},{k:'출생년도',l:'출생년도',w:80,raw:1},{k:'경력',l:'경력 (년)',w:80,raw:1},{k:'자격증',l:'자격증',w:200},{k:'희망지역',l:'희망 근무지역',w:120},{k:'영입시기',l:'영입 예정 시기',w:110,sel:'month'},
   {k:'배치현장',l:'배치 예정 현장',w:240,calcText:(r,d)=>{const a=pickedBy(d,'예비소장',recruitLabel(r));return a?a.현장명+(a.예정?' ('+a.예정+' 착공)':''):''}}],
   blank:()=>({이름:'',출생년도:'',경력:'',자격증:'',희망지역:'',영입시기:''})},
};
let docs={}, team='t1', sheet='수주목표', readonly=false, subtab={}, cred=null, lastSaved={};
try{team=localStorage.getItem('bp.team')||team; sheet=localStorage.getItem('bp.sheet')||sheet; subtab=JSON.parse(localStorage.getItem('bp.sub')||'{}')}catch(e){}
if(!SHEETS[sheet])sheet='수주목표';
const setSub=(k,v)=>{subtab[k]=v;try{localStorage.setItem('bp.sub',JSON.stringify(subtab))}catch(e){};render()};
const curYear=()=>{const y=Number(subtab.year);return YEARS.includes(y)?y:2027};
const $=s=>document.querySelector(s);
const el=(t,a,...c)=>{const e=document.createElement(t);if(a)for(const k in a){if(k==='class')e.className=a[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k])}for(const x of c){if(x==null)continue;e.append(x.nodeType?x:document.createTextNode(String(x)))}return e};
let UNIT='원'; try{UNIT=localStorage.getItem('bp.unit')==='억'?'억':'원'}catch(e){}
const fmt=v=>{if(v===''||v==null)return '';const n=Number(String(v).replace(/,/g,''));return isNaN(n)?String(v):n.toLocaleString('ko-KR')};
const fmtM=v=>{if(v===''||v==null)return '';const n=num(v);if(UNIT==='억')return (n/1e8).toLocaleString('ko-KR',{minimumFractionDigits:1,maximumFractionDigits:1});return fmt(n)};
const parseM=t=>{const c=String(t).replace(/[^\d.-]/g,'');if(c===''||c==='-')return '';const n=Number(c);if(isNaN(n))return '';return UNIT==='억'?String(Math.round(n*1e8)):String(Math.round(n))};
const unitLabel=()=>UNIT==='억'?'억원':'원';
const num=v=>{const n=Number(String(v??'').replace(/,/g,''));return isNaN(n)?0:n};
const eok=v=>Math.abs(v)>=1e7?(v/1e8).toFixed(1)+'억':'';
const pct=(a,b)=>b?(a/b*100).toFixed(1)+'%':'';
const teamName=id=>(TEAMS.find(x=>x[0]===id)||[])[1]||id;
const ym=s=>Number(String(s||'').replace('.',''))||0;
const label=(name,m)=>name+' ('+m+')';
const recruitLabel=r=>r.이름+' (영입'+(r.영입시기?' '+r.영입시기:'')+')';
const uid=()=>Math.random().toString(36).slice(2,9);
const fmtTime=iso=>{if(!iso)return '';const d=new Date(iso);return isNaN(d)?'':(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function setStatus(t){const st=$('#status');const lo=st.querySelector('.lo');st.textContent=t;if(lo)st.append(lo)}

// ---- persistence: Apps Script, 섹션 단위 저장(바뀐 섹션만), 팀별 한 번에 하나
const pending={}, inflight={}, timers={};
const sectionOf=(d,sec)=>sec==='meta'?Object.fromEntries(META_KEYS.map(k=>[k,d[k]])):sec==='kpi'?(d.실적2026||{}):d[sec];
const writable=sec=>ROLE==='admin'||sec!=='kpi';
const snapshot=d=>Object.fromEntries(SECTIONS.filter(writable).map(sec=>[sec,JSON.stringify(sectionOf(d,sec)??null)]));
function save(id){ if(readonly||!docs[id])return; docs[id].updatedAt=new Date().toISOString(); pending[id]=true; setStatus('저장 중'); clearTimeout(timers[id]); timers[id]=setTimeout(()=>flush(id),800); }
async function post(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({id:cred.id,pw:cred.pw},body))});const j=await r.json();if(!j.ok)throw new Error(j.error||'save');return j}
async function flush(id){
  if(inflight[id]){pending[id]=true;return}
  pending[id]=false; inflight[id]=true;
  try{
    const d=docs[id]; const now=snapshot(d); const prev=lastSaved[id]||{};
    for(const sec of SECTIONS){ if(!writable(sec)||now[sec]===prev[sec])continue; await post({action:'save',team:id,section:sec,value:JSON.parse(now[sec])}); prev[sec]=now[sec]; }
    lastSaved[id]=prev; setStatus('저장됨 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));
